# Live reload for the API. Run via `go tool air` — air is pinned as a module
# tool in go.mod, so there is nothing to install globally.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  # entrypoint, not the deprecated `bin`. Runs with the working directory at
  # server/, so godotenv finds server/.env.
  entrypoint = ["./tmp/main"]

  # .env is watched too: a config change restarts the API instead of silently
  # leaving the old values loaded.
  include_ext = ["go", "env"]
  # tmp holds the binary air itself writes; watching it would rebuild forever.
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false

  # Debounce, so a multi-file save (or gofmt on save) triggers one rebuild.
  delay = 300

  # SIGINT rather than SIGKILL: the process gets to release port APP_PORT before
  # the replacement binds it, which otherwise fails with "address already in use".
  send_interrupt = true
  kill_delay = "500ms"

  # false: a build failure leaves the last good binary serving. A typo in Go
  # would otherwise take the API down, and the Angular app — which is up and
  # proxying /api — starts throwing network errors instead of just waiting.
  stop_on_error = false
  log = "build-errors.log"

[log]
  # dev.sh already prefixes and timestamps every line.
  time = false
  main_only = false

[misc]
  # Leave tmp/main in place: dev.sh builds it up front to fail fast on a
  # compile error, and a stale binary there is harmless.
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
