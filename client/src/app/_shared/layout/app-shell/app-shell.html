<!--
  hlm-sidebar and main[hlmSidebarInset] must be siblings inside the wrapper —
  the inset positioning is a sibling selector, not a nesting one.
-->
<div hlmSidebarWrapper>
  <app-sidebar />

  <main hlmSidebarInset>
    <app-site-header />
    <div class="flex flex-1 flex-col gap-4 p-4 pt-0">
      <router-outlet />
    </div>
  </main>
</div>
