<hlm-sidebar-group class="group-data-[collapsible=icon]:hidden">
  <div hlmSidebarGroupLabel>Workspaces</div>
  <ul hlmSidebarMenu>
    @for (workspace of workspaces(); track workspace.url) {
      <li hlmSidebarMenuItem>
        <a hlmSidebarMenuButton [routerLink]="workspace.url" [tooltip]="workspace.title">
          <ng-icon [name]="workspace.icon" />
          {{ workspace.title }}
        </a>
        <button
          hlmSidebarMenuAction
          showOnHover
          [hlmDropdownMenuTrigger]="workspaceMenu"
          [hlmDropdownMenuTriggerData]="{ $implicit: workspace }"
          [side]="menuSide()"
          [align]="menuAlign()"
        >
          <ng-icon name="lucideEllipsis" />
          <span class="sr-only">More options for {{ workspace.title }}</span>
        </button>
      </li>
    }

    <li hlmSidebarMenuItem>
      <button hlmSidebarMenuButton class="text-sidebar-foreground/70" tooltip="New workspace">
        <ng-icon name="lucidePlus" />
        New workspace
      </button>
    </li>
  </ul>
</hlm-sidebar-group>

<ng-template #workspaceMenu let-workspace>
  <hlm-dropdown-menu class="w-48">
    <hlm-dropdown-menu-group>
      <hlm-dropdown-menu-label>{{ workspace.title }}</hlm-dropdown-menu-label>
    </hlm-dropdown-menu-group>
    <hlm-dropdown-menu-separator />
    <button hlmDropdownMenuItem>
      <ng-icon name="lucideFolder" />
      Open workspace
    </button>
    <button hlmDropdownMenuItem>
      <ng-icon name="lucideShare" />
      Share workspace
    </button>
    <hlm-dropdown-menu-separator />
    <button hlmDropdownMenuItem>
      <ng-icon name="lucideTrash2" />
      Delete workspace
    </button>
  </hlm-dropdown-menu>
</ng-template>
