<ul hlmSidebarMenu>
  <li hlmSidebarMenuItem>
    <button
      hlmSidebarMenuButton
      size="lg"
      [hlmDropdownMenuTrigger]="userMenu"
      [side]="menuSide()"
      align="end"
    >
      <hlm-avatar class="size-8 rounded-lg">
        <span hlmAvatarFallback class="rounded-lg text-xs">{{ profile.initials() }}</span>
      </hlm-avatar>
      <div class="grid flex-1 text-left text-sm leading-tight">
        <span class="truncate font-medium">{{ profile.displayName() }}</span>
        <span class="truncate text-xs">{{ profile.email() }}</span>
      </div>
      <ng-icon name="lucideChevronsUpDown" class="ml-auto text-base" />
    </button>
  </li>
</ul>

<ng-template #userMenu>
  <hlm-dropdown-menu class="min-w-56 rounded-lg">
    <hlm-dropdown-menu-label>
      <div class="flex items-center gap-2 px-1 py-1.5 text-left text-sm">
        <hlm-avatar class="size-8 rounded-lg">
          <span hlmAvatarFallback class="rounded-lg text-xs">{{ profile.initials() }}</span>
        </hlm-avatar>
        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-medium">{{ profile.displayName() }}</span>
          <span class="truncate text-xs">{{ profile.email() }}</span>
        </div>
      </div>
    </hlm-dropdown-menu-label>
    <hlm-dropdown-menu-separator />

    <hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem>
        <ng-icon name="lucideSparkles" />
        Upgrade to Pro
      </button>
    </hlm-dropdown-menu-group>
    <hlm-dropdown-menu-separator />

    <hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem>
        <ng-icon name="lucideBadgeCheck" />
        Account
      </button>
      <button hlmDropdownMenuItem>
        <ng-icon name="lucideCreditCard" />
        Billing
      </button>
      <button hlmDropdownMenuItem>
        <ng-icon name="lucideBell" />
        Notifications
      </button>
    </hlm-dropdown-menu-group>
    <hlm-dropdown-menu-separator />

    <button hlmDropdownMenuItem [disabled]="signingOut()" (click)="signOut()">
      <ng-icon name="lucideLogOut" />
      Log out
    </button>
  </hlm-dropdown-menu>
</ng-template>
