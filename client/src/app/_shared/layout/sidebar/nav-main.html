<hlm-sidebar-group>
  <div hlmSidebarGroupLabel>Platform</div>
  <ul hlmSidebarMenu>
    @for (item of items(); track item.url) {
      <hlm-collapsible>
        <li hlmSidebarMenuItem>
          <a
            hlmSidebarMenuButton
            [routerLink]="item.url"
            routerLinkActive
            #linkActive="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: item.url === '/' }"
            [isActive]="linkActive.isActive"
            [tooltip]="item.title"
          >
            <ng-icon [name]="item.icon" />
            {{ item.title }}
          </a>

          @if (item.items; as subItems) {
            <button
              hlmCollapsibleTrigger
              hlmSidebarMenuAction
              class="data-[state=open]:rotate-90"
              [attr.aria-label]="'Toggle ' + item.title"
            >
              <ng-icon name="lucideChevronRight" />
            </button>
            <hlm-collapsible-content>
              <ul hlmSidebarMenuSub>
                @for (subItem of subItems; track subItem.url) {
                  <li hlmSidebarMenuSubItem>
                    <a hlmSidebarMenuSubButton [routerLink]="subItem.url">{{ subItem.title }}</a>
                  </li>
                }
              </ul>
            </hlm-collapsible-content>
          }
        </li>
      </hlm-collapsible>
    }
  </ul>
</hlm-sidebar-group>
